  /v1/host/withdrawals:
    post:
      operationId: requestWithdrawal
      tags:
        - host
      summary: Request a withdrawal into the next weekly payout cycle.
      description: "Server behaviour:
1. Return 503 payouts_not_enabled until PAYOUTS_ENABLED (R3-7: incorporation + provider onboarding).
2. Check host approved, KYC passed, payout method verified, no restriction or open fraud case.
3. In one transaction: lock the host's bean_available balance row; check beans ≥ MinWithdrawalBeans (₹500 = 100,000 Beans) and ≤ available.
4. Insert withdrawal (status requested) and post ledger.WithdrawalRequested (available → payout_pending).
5. The weekly payout-cycle job picks it up."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-required-roles:
        - host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: "Business rule or conflict. `code`/`rule` one of: payouts_not_enabled, below_minimum_withdrawal, insufficient_available_beans, kyc_required, payout_method_missing, account_restricted"
          content:
