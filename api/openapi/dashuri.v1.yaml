        lock (level and Verified Host status are read in the same transaction,
        never taken from the client): minimum 500; maximum level × 1,000
        (levels 1–10); above 3,000 requires an ACTIVE Verified Host.
        Errors (422 business_rule): rate_below_minimum,
        rate_outside_level_limits, verification_required_for_rate; 422
