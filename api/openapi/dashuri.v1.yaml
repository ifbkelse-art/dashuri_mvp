  /v1/purchases/google-play:
    post:
      operationId: verifyGooglePlayPurchase
      tags:
        - purchases
      summary: Verify a Play purchase token and credit Diamonds exactly once.
      description: "Server behaviour:
1. Hash the purchase token; the purchases table is UNIQUE on token hash, so replays return the original result.
2. Call the Google Play Developer API (purchases.products) with the service account; check package name, product id, purchase state, and that the order is not already consumed elsewhere.
3. Pending payment → status pending, no credit (credited later from RTDN).
4. Purchased → in one transaction insert the purchase and post ledger.PurchaseCredit (key purchase_credit:<token_hash>); award XP = 8 × Diamonds.
5. Acknowledge/consume with Play per current Billing requirements; the client completes only after credited."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyGooglePlayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseVerification"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: "Business rule or conflict. `code`/`rule` one of: purchase_token_invalid, purchase_already_used_by_other_account, product_unknown"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "501":
          description: Scaffolded endpoint not implemented yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
