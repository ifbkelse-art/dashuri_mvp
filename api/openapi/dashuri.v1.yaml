# Dashuri API contract (OpenAPI 3.1). Source of truth for app ↔ backend.
# Scaffolded 2026-11-17 from the architecture endpoint registry; edit this file going forward.
openapi: "3.1.0"
info:
  title: Dashuri API
  version: 1.0.0-draft
  description: "Contract between the Dashuri mobile app and the Go backend. Draft scaffold: endpoints return 501 until implemented. All money and virtual-currency amounts are integers (Diamonds, Beans, INR paise). Value-moving and create operations require an Idempotency-Key. The client never submits call durations or Diamond amounts for calls."
servers:
  - url: "https://api.dashuri.invalid"
    description: "TODO: real hostnames per environment"
security:
  - bearerAuth: []
tags:
  - name: accounts
  - name: admin
  - name: calls
  - name: chat
  - name: discovery
  - name: free-call
  - name: host
  - name: levels
  - name: notifications
  - name: ops
  - name: privacy
  - name: purchases
  - name: safety
