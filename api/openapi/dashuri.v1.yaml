  /v1/discovery/hosts:
    get:
      operationId: listAvailableHosts
      tags:
        - discovery
      summary: "Hosts online and accepting calls, with their rates. Excludes blocked users."
      description: >-
        rate_per_minute is the price the next call uses (stored price within
        current eligibility). In the `recommended` sort an ACTIVE Verified Host
        ranks as if it had DISCOVERY_VERIFIED_BOOST_XP more lifetime XP (a
        configurable ranking signal); non-verified hosts are never excluded
        unless the `verification` filter asks for it.
      parameters:
        - name: verification
          in: query
          required: false
          description: "Verified Host filter (2026-11-23)."
          schema:
            type: string
            enum:
              - all
              - verified
              - non_verified
            default: all
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
