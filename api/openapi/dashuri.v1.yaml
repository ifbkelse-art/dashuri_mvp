      operationId: sendGift
      tags:
        - gifts
      summary: "Customer sends a virtual gift to the host of an ACTIVE call. Server-authoritative and atomic: price from the catalogue, Diamonds spent promotional-first (never the call's reserved Diamonds), host Beans from the versioned economy rule set into the 7-day hold, one ledger entry (gift_send), one immutable gift transaction and one chat line, or nothing. The Idempotency-Key MUST be a UUIDv4: a retry with the same key and body returns the stored gift (200, replayed=true) without charging again; the same key with a different gift/recipient/call is refused (422). Business rules: hosts_cannot_send_gifts, call_not_giftable, host_cannot_receive_gifts, blocked, gift_unavailable, insufficient_diamonds, gift_spend_limit, account_restricted, not_age_eligible; 429 gift_rate_limited."
