components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Supabase Auth access token; verified against the project JWKS. Roles come from the Dashuri database, not token claims."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per user intent; reuse it for every retry of that intent. Same key + different body → 422.
      schema:
        type: string
        minLength: 16
        maxLength: 64
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    GiftParty:
      type: object
      additionalProperties: false
      required: [user_id, display_name]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
    Gift:
      type: object
      additionalProperties: false
      required: [id, name, description, emoji, icon_asset, animation_asset, animation_duration_ms, sound_asset, tier, sort_order, diamond_price]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: Stable gift id}
        name: {type: string}
        description: {type: string}
        emoji: {type: string}
        icon_asset: {type: string, description: "App asset key (e.g. gift/rose) or https URL"}
        animation_asset: {type: string, description: "Celebration reference (e.g. celebration/rose)"}
        animation_duration_ms: {type: integer, minimum: 1000, maximum: 10000}
        sound_asset: {type: ["string", "null"]}
        tier: {type: string, enum: [common, rare, epic, legendary, mythic]}
        sort_order: {type: integer}
        diamond_price: {type: integer, format: int64, minimum: 1}
    GiftCatalogue:
      type: object
      additionalProperties: false
      required: [items, updated_at]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Gift"}
        updated_at: {type: string, format: date-time, description: "Newest catalogue change; clients refresh when it moves"}
    SendGiftRequest:
      type: object
      additionalProperties: false
      required: [gift_id, recipient_user_id]
      description: "No price or amount: the server prices the gift."
      properties:
        gift_id: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$"}
        recipient_user_id: {type: string, format: uuid, description: "Must be the call's host"}
    GiftEvent:
      type: object
      additionalProperties: false
      description: "Public, canonical description of one sent gift (also the call.gift realtime payload on call:<id>). No wallet balances, ledger or accounting data. Clients dedupe by gift_transaction_id."
      required: [gift_transaction_id, gift_id, gift_name, emoji, tier, diamond_value, sender, recipient, call_id, animation_asset, animation_duration_ms, chat_message_id, sent_at]
      properties:
        gift_transaction_id: {type: string, format: uuid}
        gift_id: {type: string}
        gift_name: {type: string}
        emoji: {type: string}
        tier: {type: string, enum: [common, rare, epic, legendary, mythic]}
        diamond_value: {type: integer, format: int64, description: "Price charged when sent (never re-priced)"}
        sender: {$ref: "#/components/schemas/GiftParty"}
        recipient: {$ref: "#/components/schemas/GiftParty"}
        call_id: {type: string, format: uuid}
        animation_asset: {type: string}
        animation_duration_ms: {type: integer}
