  /v1/free-call/requests:
    post:
      operationId: requestFreeCall
      tags:
        - free-call
      summary: "Use the card: random match with an opted-in available host (Android only)."
      description: "Server behaviour:
1. Verify the Play Integrity token server-side; bind the card to phone number AND device (S4: one card per phone and device).
2. In one transaction: lock the user's free_call_cards row; refuse if used.
3. Pick a random available host with free_call_opt_in and fewer than 20 free calls today (FreeCallMaxPerHostPerDay); lock that host's daily counter row.
4. Create a call with is_free_call = true and a 60-second server cap; no Diamonds reserved.
5. Host compensation (₹10 = 2,000 Beans) is posted only when the server confirms an eligible free-call minute (ledger.FreeCallCompensation)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeCallRequestBody"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeCallRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: "Business rule or conflict. `code`/`rule` one of: free_call_unavailable_on_platform, card_already_used, device_already_used, not_age_eligible, integrity_check_failed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "501":
