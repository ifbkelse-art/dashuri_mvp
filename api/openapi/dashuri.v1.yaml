      type: object
      required: [url, format, hls_url, thumbnail_url, expires_at]
      properties:
        url: {type: string, description: "Signed playback URL (open with the player). Never stored; refetch after expires_at."}
        format: {type: string, enum: [mp4, hls], description: "mp4 for R2 reels (progressive, faststart); hls for legacy Mux reels."}
        hls_url: {type: string, description: "Deprecated: equals url for HLS reels and is empty for MP4 reels. Kept for app builds from before R2."}
        thumbnail_url: {type: string}
        expires_at: {type: string, format: date-time}
    Reel:
      type: object
      required: [id, creator, caption, language, duration_ms, status, rejection_code, like_count, view_count, share_count, liked_by_me, is_mine, playback, published_at, created_at]
      properties:
        id: {type: string, format: uuid}
