    post:
      operationId: actOnHostVerification
      tags:
        - admin
      summary: "Move a Verified Host application through the state machine (audited). Suspend/revoke cap the price at min(3,000, level max) in the same transaction."
      description: >-
        Allowed: start_review (submitted→under_review); request_info
        (submitted|under_review→info_required, info_request required); approve
        (under_review→verified, required evidence present); reject
        (submitted|under_review|info_required→rejected); suspend
        (verified→suspended); reinstate (suspended→verified); revoke
        (verified|suspended→revoked). reject/suspend/reinstate/revoke need a
        reason. 403 self_review on one's own account; 409 invalid_transition.
        Approval and reinstatement never change the price; live calls keep
        their rate.
      x-required-roles:
        - moderator
        - admin
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationActionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
