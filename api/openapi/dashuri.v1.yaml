components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Supabase Auth access token; verified against the project JWKS. Roles come from the Dashuri database, not token claims."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID per user intent; reuse it for every retry of that intent. Same key + different body → 422.
      schema:
        type: string
        minLength: 16
        maxLength: 64
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PendingPhotoItem:
      type: object
      required: [photo_id, user_id, read_url, created_at]
      properties:
        photo_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        read_url: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    PendingPhotoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PendingPhotoItem"}
        next_cursor: {type: [string, "null"]}
    PhotoDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: [string, "null"], maxLength: 500}
