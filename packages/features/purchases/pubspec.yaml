publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  bloc: ^9.0.0
  dashuri_core:
    path: ../../core
  dashuri_design_system:
    path: ../../design_system
  dashuri_navigation:
    path: ../../navigation
  dashuri_network:
    path: ../../network
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  in_app_purchase: ^3.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  dashuri_lints:
    path: ../../lints
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
