publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  dashuri_core:
    path: ../core
  dio: ^5.9.0
  equatable: ^2.0.7

dev_dependencies:
  dashuri_lints:
    path: ../lints
  mocktail: ^1.0.4
  test: ^1.25.0
