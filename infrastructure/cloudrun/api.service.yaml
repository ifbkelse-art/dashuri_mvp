# Cloud Run service template. Replace ${...} placeholders before applying.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    app: dashuri
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: dashuri-api@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: asia-south1-docker.pkg.dev/${PROJECT}/dashuri/api:${TAG}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DASHURI_ENV
              value: ${ENV}
            - name: PLAY_PACKAGE_NAME
              value: com.bkenterprises.dashuri
            - name: PAYOUTS_ENABLED
              value: "false"
            - name: SUPABASE_URL
              value: ${SUPABASE_URL}
            - name: SUPABASE_JWKS_URL
              value: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
            - name: SUPABASE_JWT_ISSUER
              value: ${SUPABASE_URL}/auth/v1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest
            - name: STREAM_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: stream-api-secret
                  key: latest
            - name: SUPABASE_REALTIME_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-realtime-key
                  key: latest
          startupProbe:
            httpGet:
              path: /readyz
          livenessProbe:
            httpGet:
              path: /healthz
